# Bản sao cấu hình nginx trên 202.92.6.143, file thật ở
#   /etc/nginx/site-node/reminder.nguyenvando.com.conf
# Giữ trong repo để biết vì sao nó như vậy — nginx không đọc file này.
#
# App chạy Docker ngay trên máy này, web container bind 127.0.0.1:5599 nên
# không có cổng nào của app lộ ra Internet; nginx là lối vào duy nhất.
# TLS phía người dùng do OneShield lo; OneShield nối về origin qua 443,
# nên block này vẫn phải nghe 443 với cert Let's Encrypt.
server {
    listen 80;
    listen 443 ssl;
    server_name reminder.nguyenvando.com;

    ssl_certificate     /etc/letsencrypt/live/nguyenvando.com-0007/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nguyenvando.com-0007/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/reminder.access.log main;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5599/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
