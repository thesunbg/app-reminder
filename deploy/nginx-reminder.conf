# Bản sao cấu hình nginx trên 202.92.6.143, file thật ở
#   /etc/nginx/site-node/reminder.nguyenvando.com.conf
# Giữ trong repo để biết vì sao nó như vậy — nginx không đọc file này.
#
# App chạy Docker ngay trên máy này, web container bind 127.0.0.1:5599 nên
# không có cổng nào của app lộ ra Internet; nginx là lối vào duy nhất.
#
# Từ 26/09/2026 **proxy OneShield đã tắt**, domain trỏ thẳng về máy này. Vì vậy
# nginx phải tự lo những gì OneShield từng lo: cert đúng tên (trước đó vhost
# mượn cert `nguyenvando.com-0007` chỉ có SAN `nguyenvando.com` — OneShield
# không verify nên không ai phát hiện), redirect 80→443, HTTP/2, và HSTS.
#
# LƯU Ý khi sửa file thật: comment phải là ASCII không dấu. certbot 0.31 trên
# máy này chạy Python 2 và chết với UnicodeDecodeError khi đọc vhost có UTF-8.
server {
    listen 443 ssl http2;
    server_name reminder.nguyenvando.com;
    ssl_certificate /etc/letsencrypt/live/reminder.nguyenvando.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reminder.nguyenvando.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/reminder.access.log main;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5599/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # chỉ block 443 phục vụ nội dung, cổng 80 redirect hết sang đây
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

server {
    if ($host = reminder.nguyenvando.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name reminder.nguyenvando.com;
    return 404; # managed by Certbot
}
