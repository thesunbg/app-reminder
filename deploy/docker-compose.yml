# Chạy trên 202.92.6.143 — cùng máy với nginx, nên web chỉ bind 127.0.0.1:
# không có cổng nào của app lộ ra Internet, nginx là lối vào duy nhất.
# nginx proxy reminder.nguyenvando.com → 127.0.0.1:${APP_PORT}.
# Image build sẵn trên GitHub Actions (ghcr.io) — máy này chỉ pull, không build:
# kernel 3.10 + seccomp Docker 19.03 trả EPERM ngẫu nhiên khi pnpm install.
# Vì cùng lý do, server/web chạy seccomp:unconfined.
# Máy dev trên macOS chạy Postgres trực tiếp qua brew, không cần file này.
# Không khai báo `version:` — docker-compose v2 trên 143 bỏ qua nó và chỉ kêu
# obsolete; 143 không còn compose v1 nào cần tới nó.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_hub
      POSTGRES_USER: family_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bat buoc dat POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U family_hub -d family_hub']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/thesunbg/app-reminder-server:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    security_opt: ['seccomp:unconfined']
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://family_hub:${POSTGRES_PASSWORD}@db:5432/family_hub?schema=public
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?bat buoc dat SESSION_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?bat buoc dat WEB_ORIGIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      TZ: Asia/Ho_Chi_Minh

  web:
    image: ghcr.io/thesunbg/app-reminder-web:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    security_opt: ['seccomp:unconfined']
    depends_on: [server]
    ports: ['127.0.0.1:${APP_PORT:-5599}:80']

volumes:
  pgdata:
