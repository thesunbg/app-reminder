name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: family_hub_test
          POSTGRES_USER: family_hub
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family_hub -d family_hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fh/server db:generate
      - run: pnpm typecheck

      # Test luôn dùng DB riêng (service container), không bao giờ đụng DB thật.
      - name: Tạo .env.test
        working-directory: apps/server
        run: |
          KEYS=$(node -e "const k=require('web-push').generateVAPIDKeys();console.log(k.publicKey+' '+k.privateKey)")
          # Service account giả, khoá sinh tại chỗ: đủ để test ký JWT mà không
          # có bí mật thật nào trong repo hay trong secrets của GitHub.
          SA=$(node -e "
            const {generateKeyPairSync}=require('node:crypto');
            const {privateKey}=generateKeyPairSync('rsa',{modulusLength:2048});
            console.log(JSON.stringify({
              project_id:'family-hub-test',
              client_email:'test@family-hub-test.iam.gserviceaccount.com',
              private_key:privateKey.export({type:'pkcs8',format:'pem'}),
            }));
          ")
          cat > .env.test <<ENV
          DATABASE_URL="postgresql://family_hub:test@localhost:5432/family_hub_test?schema=public"
          SESSION_SECRET="ci-secret-khong-dung-that-0123456789abcdef"
          NODE_ENV=test
          VAPID_PUBLIC_KEY="${KEYS% *}"
          VAPID_PRIVATE_KEY="${KEYS#* }"
          VAPID_SUBJECT="mailto:ci@local"
          FCM_SERVICE_ACCOUNT='${SA}'
          ENV
      - run: pnpm test
      - run: pnpm --filter @fh/web build

  build:
    name: Build image → ghcr.io
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        svc: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.svc }}
          push: true
          tags: |
            ghcr.io/thesunbg/app-reminder-${{ matrix.svc }}:latest
            ghcr.io/thesunbg/app-reminder-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,scope=${{ matrix.svc }},mode=max

  # Deploy không nằm ở đây: server 202.92.6.172 tự kéo về theo cron
  # (deploy/autodeploy.sh) khi thấy image gắn tag commit HEAD đã có trên ghcr.io.
  # Nhờ vậy GitHub không cần giữ SSH key nào.
